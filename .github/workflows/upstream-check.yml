name: Check upstream

# 上游有变动时自动抓快照、提交、并开一个带 diff 的 Issue。
# 因为不需要本地开发环境，日常流程就是：收到 Issue 通知 -> 看 diff -> 决定是否吸收。
#
# 需要仓库开启：Settings -> Actions -> General -> Workflow permissions
#              选 "Read and write permissions"

on:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）。上游节奏很慢，每周一次足够。
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  # GitHub Issue body 上限 65536 字符，留出正文模板的余量
  DIFF_LIMIT: 50000

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect baseline run
        id: baseline
        run: |
          # 首次运行时 upstream/ 下没有任何快照，全部文件都会算作"新增"，
          # 这时开 Issue 没有意义（diff 就是整个上游代码）。只提交基线即可。
          if [ -z "$(ls -A upstream/hasscc 2>/dev/null)" ] \
             && [ -z "$(ls -A upstream/marcelwestra 2>/dev/null)" ]; then
            echo "first_run=true" >> "$GITHUB_OUTPUT"
            echo "首次运行，建立基线快照。"
          else
            echo "first_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch upstream snapshots
        run: |
          set -euo pipefail

          # 本项目的直接基座（国内服分支）
          HASSCC_RAW="https://raw.githubusercontent.com/hasscc/home-assistant-niu-component/master/custom_components/niu"
          HASSCC_FILES="__init__.py api.py config_flow.py const.py coordinator.py sensor.py manifest.json strings.json"

          # 整个 fork 网络的根（国际服分支，仍在维护，值得跟）
          MW_RAW="https://raw.githubusercontent.com/marcelwestrahome/home-assistant-niu-component/master/custom_components/niu"
          MW_FILES="__init__.py api.py camera.py config_flow.py const.py sensor.py manifest.json"

          # 每次全量重建，顺带清掉上游已删除的文件和旧版命名残留
          rm -rf upstream/hasscc upstream/marcelwestra
          mkdir -p upstream/hasscc upstream/marcelwestra

          # hassfest 把「含 __init__.py 或 manifest.json 的目录」一律当作集成
          # (script/hassfest/model.py: Integration.load_dir)，快照目录会被误判成
          # 域名为 niu 但目录名不符的集成而报错。给这两个文件加 .txt 后缀避开发现逻辑，
          # 其余 .py 保持原扩展名，diff 里仍有语法高亮。
          snapshot_name() {
            case "$1" in
              manifest.json|__init__.py) echo "$1.txt" ;;
              *)                         echo "$1" ;;
            esac
          }

          fetch() {
            local base="$1" dir="$2"; shift 2
            for f in "$@"; do
              local out; out="$(snapshot_name "$f")"
              if curl -fsSL --retry 3 --retry-delay 5 -o "$dir/$out" "$base/$f"; then
                echo "  ok   $dir/$out"
              else
                echo "  MISS $dir/$out (上游可能已删除该文件)"
                rm -f "$dir/$out"
              fi
            done
          }

          echo "== hasscc =="
          fetch "$HASSCC_RAW" upstream/hasscc $HASSCC_FILES
          echo "== marcelwestra =="
          fetch "$MW_RAW" upstream/marcelwestra $MW_FILES

      - name: Detect drift
        id: drift
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain upstream/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无变化。"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git add -A upstream/

          # 注意：不要写成 `git diff | head -c N`。
          # head 读满 N 字节就关闭管道退出，git 随即收到 SIGPIPE 以 141 退出，
          # 在 set -o pipefail 下会让整个 step 失败。
          # 先完整落盘，再从文件截断，head 读文件不产生 SIGPIPE。
          git diff --cached -- upstream/ > "$RUNNER_TEMP/full.diff"
          git diff --cached --stat -- upstream/ > "$RUNNER_TEMP/full.stat"

          head -c "$DIFF_LIMIT" "$RUNNER_TEMP/full.diff" > "$RUNNER_TEMP/upstream.diff"
          head -n 60 "$RUNNER_TEMP/full.stat" > "$RUNNER_TEMP/upstream.stat"

          full_size=$(wc -c < "$RUNNER_TEMP/full.diff")
          if [ "$full_size" -gt "$DIFF_LIMIT" ]; then
            echo "truncated=true" >> "$GITHUB_OUTPUT"
            echo "diff 共 ${full_size} 字节，已截断到 ${DIFF_LIMIT}。"
          else
            echo "truncated=false" >> "$GITHUB_OUTPUT"
          fi

          # 纯重命名、权限变更等情况下 git 报告 0 增 0 删，没有任何实际内容变动，
          # 提交快照即可，不必开 Issue 打扰。
          # 用 --numstat 而不是解析 --shortstat：前者是稳定的「增<TAB>删<TAB>路径」
          # 三列格式（二进制文件为 -），后者是给人读的英文句子，措辞随 git 版本变化
          # （"1 deletion" / "2 deletions"），拿来做判据不可靠。
          changed_lines=$(
            git diff --cached --numstat -- upstream/ \
              | awk '{ if ($1 ~ /^[0-9]+$/) a += $1; if ($2 ~ /^[0-9]+$/) d += $2 } END { print a + d + 0 }'
          )
          git diff --cached --shortstat -- upstream/

          if [ "$changed_lines" -eq 0 ]; then
            echo "content_changed=false" >> "$GITHUB_OUTPUT"
            echo "仅有重命名或结构调整，无内容变动，跳过开 Issue。"
          else
            echo "content_changed=true" >> "$GITHUB_OUTPUT"
            echo "内容变动共 ${changed_lines} 行。"
          fi

      - name: Commit snapshot
        if: steps.drift.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.baseline.outputs.first_run }}" = "true" ]; then
            git commit -m "chore: 建立上游快照基线"
          elif [ "${{ steps.drift.outputs.content_changed }}" = "false" ]; then
            git commit -m "chore: 上游快照结构调整（无内容变更）"
          else
            git commit -m "chore: 同步上游快照"
          fi

          # 并发或手动推送导致落后时重试一次
          git push || { git pull --rebase && git push; }

      - name: Open issue
        if: >-
          steps.drift.outputs.changed == 'true'
          && steps.drift.outputs.content_changed == 'true'
          && steps.baseline.outputs.first_run != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tmp = process.env.RUNNER_TEMP;
            const diff = fs.readFileSync(`${tmp}/upstream.diff`, 'utf8');
            const stat = fs.readFileSync(`${tmp}/upstream.stat`, 'utf8');
            const truncated = '${{ steps.drift.outputs.truncated }}' === 'true';
            const today = new Date().toISOString().slice(0, 10);

            const body = [
              '上游代码有变动，快照已提交到 `upstream/`。',
              '',
              '## 变更概览',
              '```',
              stat.trim(),
              '```',
              '',
              '## 完整 diff',
              truncated
                ? '> diff 过大已截断，完整内容见 `upstream/` 目录的本次提交。'
                : '',
              '<details><summary>展开</summary>',
              '',
              '```diff',
              diff,
              '```',
              '',
              '</details>',
              '',
              '## 处理清单',
              '',
              '- [ ] 是否改了 API 路径、`app_id`、UA 或鉴权方式 —— 这几项两区共用，**必须跟**',
              '- [ ] 是否只涉及 `-fk` 国际服端点 —— 与国内服无关，忽略',
              '- [ ] `SENSOR_TYPES` 是否新增或改名了传感器',
              '- [ ] 其余修复按需吸收，改完 bump `manifest.json` 的 `version`',
              '',
              '> 本仓库已重构过架构，不要用上游文件直接覆盖 `custom_components/niu/`，diff 仅作参考。',
            ].filter(Boolean).join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `上游有更新 (${today})`,
              body,
              labels: ['upstream'],
            });
